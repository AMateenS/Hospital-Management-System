# Production-style stack. Put an HTTPS reverse proxy (Caddy / nginx) in front of "frontend" on port 3000.
# Copy .env.example to .env and fill every value before `docker compose up -d --build`.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes: [mongo_data:/data/db]
    # no ports published: only the backend can reach the database
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/hms?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL}
      HOSPITAL_NAME: ${HOSPITAL_NAME}
      HOSPITAL_ADDRESS: ${HOSPITAL_ADDRESS}
      HOSPITAL_PHONE: ${HOSPITAL_PHONE}
      HOSPITAL_TZ: ${HOSPITAL_TZ}
    volumes: [uploads:/app/uploads]
    # no ports published: reached only through the frontend's /api proxy
  frontend:
    build:
      context: ./frontend
      args: { API_URL: "http://backend:5000" }
    restart: unless-stopped
    depends_on: [backend]
    ports: ["3000:3000"]
volumes:
  mongo_data:
  uploads:
